<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Workshop</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Pendaftaran Workshop</h1>
        <p>Silakan isi formulir pendaftaran di bawah ini.</p>

        <form id="formWorkshop" novalidate>
            <label for="namaWorkshop">Nama lengkap</label>
            <input type="text" id="namaWorkshop" maxlength="100">

            <p>Jumlah karakter nama: <span id="jumlahNama">0</span></p>

            <label for="emailWorkshop">Email</label>
            <input type="email" id="emailWorkshop">

            <label for="sesiWorkshop">Pilih sesi workshop</label>
            <select id="sesiWorkshop">
                <option value="">-- Pilih sesi --</option>
                <option value="Pagi">Sesi Pagi (09.00–11.00)</option>
                <option value="Siang">Sesi Siang (13.00–15.00)</option>
                <option value="Sore">Sesi Sore (15.00–17.00)</option>
            </select>

            <p>Sesi yang dipilih: <span id="ringkasanSesi">Belum dipilih</span></p>

            <button type="submit">Daftar Workshop</button>
            <button type="reset">Reset Form</button>
        </form>

        <p id="pesanWorkshop" aria-live="polite"></p>
    </main>
</body>
</html>
